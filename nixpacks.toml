# Dokploy / Nixpacks — build monorepo à la racine (mode Application)
[variables]
NODE_ENV = "production"
APP_ENV = "production"
SERVE_FRONTEND = "true"
PORT = "4000"

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = [
  "cd backend && npm ci",
  "cd frontend && npm ci",
]

[phases.build]
cmds = [
  "cd backend && npx prisma generate",
  "cd frontend && VITE_API_URL=/api npm run build:production",
  "mkdir -p backend/public && cp -r frontend/dist/* backend/public/",
]

[start]
cmd = "cd backend && npx prisma db push --skip-generate && node src/server.js"
